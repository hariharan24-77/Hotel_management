<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Room Type | Hotel PMS</title>
    <link rel="stylesheet" href="../../assets/css/common.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>
    <div class="app-container">
        <div id="sidebar-container"></div>
        <div class="main-wrapper">
            <div id="navbar-container"></div>
            <main class="dashboard-content">
                <div class="form-page">
                    <div class="page-header">
                        <h1 class="page-title">Add Room Type</h1>
                        <p class="page-subtitle">Create a room category with its pricing and capacity.</p>
                    </div>
                    <section class="card form-card">
                        <div class="form-card-header">
                            <div class="form-card-icon"><i class="fa-solid fa-layer-group"></i></div>
                            <div>
                                <h2>Room Type Details</h2>
                                <p>This information will be stored in PostgreSQL.</p>
                            </div>
                        </div>
                        <div class="form-card-body">
                            <form id="roomTypeForm">
                                <div class="form-grid">
                                    <div class="form-group">
                                        <label class="form-label" for="roomTypeName">Room type name</label>
                                        <input id="roomTypeName" class="form-control" required minlength="2"
                                            placeholder="e.g. Deluxe Room">
                                    </div>
                                    <div class="form-group">
                                        <label class="form-label" for="basePrice">Base price per night</label>
                                        <input id="basePrice" class="form-control" type="number" required min="0.01"
                                            step="0.01" placeholder="0.00">
                                    </div>
                                    <div class="form-group">
                                        <label class="form-label" for="capacity">Guest capacity</label>
                                        <input id="capacity" class="form-control" type="number" required min="1"
                                            max="20" placeholder="2">
                                    </div>
                                    <div class="form-group">
                                        <label class="form-label" for="bedType">Bed type</label>
                                        <input id="bedType" class="form-control" required minlength="2" maxlength="50"
                                            placeholder="Enter bed type">
                                    </div>
                                    <div class="form-group full-width">
                                        <label class="form-label" for="description">Description</label>
                                        <textarea id="description" class="form-control" rows="4" maxlength="500"
                                            placeholder="Describe room features"></textarea>
                                    </div>
                                </div>
                                <div id="roomTypeFormError" class="form-error" role="alert"></div>
                                <div class="form-actions">
                                    <a href="index.html" class="btn btn-outline"><i class="fa-solid fa-arrow-left"></i>
                                        Cancel</a>
                                    <button id="saveRoomTypeButton" type="submit" class="btn btn-primary"><i
                                            class="fa-solid fa-floppy-disk"></i> Save Room Type</button>
                                </div>
                            </form>
                        </div>
                    </section>
                </div>
            </main>
        </div>
    </div>
    <script src="../../assets/js/api.js"></script>
    <script src="../../assets/js/auth.js"></script>
    <script src="../../assets/js/common.js"></script>
    <script src="../../assets/js/room_types.js"></script>
</body>

</html>
