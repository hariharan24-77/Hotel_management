<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Edit Room | Hotel PMS</title>
    <link rel="stylesheet" href="../../assets/css/common.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>
    <div class="app-container">
        <div id="sidebar-container"></div>
        <div class="main-wrapper">
            <div id="navbar-container"></div>
            <main class="dashboard-content">
                <div class="form-page">
                    <div class="page-header">
                        <h1 class="page-title">Edit Room</h1>
                        <p class="page-subtitle">Update room information used across reservations and guest operations.
                        </p>
                    </div>
                    <section class="card form-card">
                        <div class="form-card-header">
                            <div class="form-card-icon"><i class="fa-solid fa-bed"></i></div>
                            <div>
                                <h2>Room Details</h2>
                                <p>Occupied status is managed automatically by check-in and checkout.</p>
                            </div>
                        </div>
                        <div class="form-card-body">
                            <form id="editRoomForm">
                                <div class="form-grid">
                                    <div class="form-group"><label class="form-label" for="editRoomNumber">Room number
                                            <span class="required-mark">*</span></label><input id="editRoomNumber"
                                            class="form-control" required maxlength="30"></div>
                                    <div class="form-group"><label class="form-label" for="editFloor">Floor <span
                                                class="required-mark">*</span></label><input type="number"
                                            id="editFloor" class="form-control" required min="0" max="200"></div>
                                    <div class="form-group"><label class="form-label" for="editRoomType">Room type <span
                                                class="required-mark">*</span></label><select id="editRoomType"
                                            class="form-select" required disabled>
                                            <option value="">Loading...</option>
                                        </select></div>
                                    <div class="form-group"><label class="form-label" for="editRoomStatus">Current
                                            status <span class="required-mark">*</span></label><select
                                            id="editRoomStatus" class="form-select" required>
                                            <option value="Available">Available</option>
                                            <option value="Maintenance">Maintenance</option>
                                            <option value="Inactive">Inactive</option>
                                            <option value="Occupied" disabled>Occupied - managed by check-in</option>
                                        </select></div>
                                </div>
                                <div id="editRoomError" class="form-error" role="alert"></div>
                                <div class="form-actions"><a href="index.html" class="btn btn-outline">Cancel</a><button
                                        id="updateRoomButton" class="btn btn-primary"><i
                                            class="fa-solid fa-floppy-disk"></i> Save Changes</button></div>
                            </form>
                        </div>
                    </section>
                </div>
            </main>
        </div>
    </div>
    <script src="../../assets/js/api.js"></script>
    <script src="../../assets/js/auth.js"></script>
    <script src="../../assets/js/common.js"></script>
    <script src="../../assets/js/rooms.js"></script>
</body>

</html>
