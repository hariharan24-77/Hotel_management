<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Tax Settings | Hotel PMS</title>
    <link rel="stylesheet" href="../../assets/css/common.css">
</head>

<body>
    <div class="app-container">
        <div id="sidebar-container"></div>
        <div class="main-wrapper">
            <div id="navbar-container"></div>
            <main class="dashboard-content">
                <div class="form-page">
                    <div class="page-header">
                        <h1 class="page-title">Tax Settings</h1>
                        <p class="page-subtitle">Configure percentage rates used when preparing invoices.</p>
                    </div>
                    <section class="card form-card">
                        <div class="form-card-body">
                            <form id="taxForm">
                                <div class="form-grid">
                                    <div class="form-group"><label class="form-label">GST percentage *</label><input
                                            type="number" id="gstPercentage" class="form-control" required min="0"
                                            max="100" step="0.01"></div>
                                    <div class="form-group"><label class="form-label">Service tax percentage
                                            *</label><input type="number" id="serviceTax" class="form-control" required
                                            min="0" max="100" step="0.01"></div>
                                </div>
                                <div id="settingsError" class="form-error"></div>
                                <div class="form-actions"><a href="index.html" class="btn btn-outline">Cancel</a><button
                                        id="saveTaxButton" class="btn btn-primary">Save Tax Settings</button></div>
                            </form>
                        </div>
                    </section>
                </div>
            </main>
        </div>
    </div>
    <script src="../../assets/js/api.js"></script>
    <script src="../../assets/js/auth.js"></script>
    <script src="../../assets/js/common.js"></script>
    <script src="../../assets/js/settings.js"></script>
</body>

</html>
