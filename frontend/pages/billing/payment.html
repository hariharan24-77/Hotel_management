<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Collect Payment | Hotel PMS</title>
    <link rel="stylesheet" href="../../assets/css/common.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>
    <div class="app-container">
        <div id="sidebar-container"></div>
        <div class="main-wrapper">
            <div id="navbar-container"></div>
            <main class="dashboard-content">
                <div class="form-page">
                    <div class="page-header">
                        <h1 class="page-title">Collect Payment</h1>
                        <p class="page-subtitle" id="paymentReference">Loading invoice...</p>
                    </div>
                    <section class="card form-card">
                        <div class="form-card-header">
                            <div class="form-card-icon"><i class="fa-solid fa-credit-card"></i></div>
                            <div>
                                <h2>Payment Details</h2>
                                <p>Partial payments are supported; overpayment is prevented.</p>
                            </div>
                        </div>
                        <div class="form-card-body">
                            <form id="paymentForm">
                                <div class="form-grid">
                                    <div class="form-group"><label class="form-label">Outstanding balance</label><input
                                            id="balanceDisplay" class="form-control" readonly></div>
                                    <div class="form-group"><label class="form-label">Amount *</label><input
                                            type="number" id="paymentAmount" class="form-control" min="0.01" step="0.01"
                                            required></div>
                                    <div class="form-group full-width"><label class="form-label">Payment method
                                            *</label><select id="paymentMethod" class="form-select" required>
                                            <option value="">Select payment method</option>
                                            <option value="Cash">Cash</option>
                                            <option value="UPI">UPI</option>
                                            <option value="Card">Card</option>
                                        </select></div>
                                </div>
                                <div id="paymentError" class="form-error"></div>
                                <div class="form-actions"><a href="index.html" class="btn btn-outline">Cancel</a><button
                                        id="savePaymentButton" class="btn btn-primary">Submit Payment</button></div>
                            </form>
                        </div>
                    </section>
                </div>
            </main>
        </div>
    </div>
    <script src="../../assets/js/api.js"></script>
    <script src="../../assets/js/auth.js"></script>
    <script src="../../assets/js/common.js"></script>
    <script src="../../assets/js/billing.js"></script>
</body>

</html>
