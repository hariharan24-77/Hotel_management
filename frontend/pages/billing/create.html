<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Create Invoice | Hotel PMS</title>
    <link rel="stylesheet" href="../../assets/css/common.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>
    <div class="app-container">
        <div id="sidebar-container"></div>
        <div class="main-wrapper">
            <div id="navbar-container"></div>
            <main class="dashboard-content">
                <div class="form-page">
                    <div class="page-header">
                        <h1 class="page-title">Create Invoice</h1>
                        <p class="page-subtitle">Generate an invoice for a completed reservation.</p>
                    </div>
                    <section class="card form-card">
                        <div class="form-card-header">
                            <div class="form-card-icon"><i class="fa-solid fa-file-circle-plus"></i></div>
                            <div>
                                <h2>Invoice Details</h2>
                                <p>Room charge is suggested from room type and stay duration.</p>
                            </div>
                        </div>
                        <div class="form-card-body">
                            <form id="invoiceForm">
                                <div class="form-grid">
                                    <div class="form-group full-width"><label class="form-label">Completed reservation
                                            *</label><select id="reservationId" class="form-select" required disabled>
                                            <option>Loading...</option>
                                        </select></div>
                                    <div class="form-group"><label class="form-label">Room charge *</label><input
                                            type="number" id="roomCharge" class="form-control" min="0.01" step="0.01"
                                            required></div>
                                    <div class="form-group"><label class="form-label">Service charge *</label><input
                                            type="number" id="serviceCharge" class="form-control" value="0" min="0"
                                            step="0.01" required></div>
                                    <div class="form-group"><label class="form-label">Tax *</label><input type="number"
                                            id="tax" class="form-control" value="0" min="0" step="0.01" required></div>
                                    <div class="form-group"><label class="form-label">Total</label><input
                                            id="totalAmount" class="form-control" value="0.00" readonly></div>
                                </div>
                                <div id="invoiceError" class="form-error"></div>
                                <div class="form-actions"><a href="index.html" class="btn btn-outline">Cancel</a><button
                                        id="saveInvoiceButton" class="btn btn-primary">Generate Invoice</button></div>
                            </form>
                        </div>
                    </section>
                </div>
            </main>
        </div>
    </div>

    
    <script src="../../assets/js/api.js"></script>
    <script src="../../assets/js/auth.js"></script>
    <script src="../../assets/js/common.js"></script>
    <script src="../../assets/js/billing.js"></script>
</body>

</html>
