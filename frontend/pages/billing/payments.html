<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Payments | Hotel PMS</title>
    <link rel="stylesheet" href="../../assets/css/common.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>
    <div class="app-container">
        <div id="sidebar-container"></div>
        <div class="main-wrapper">
            <div id="navbar-container"></div>
            <main class="dashboard-content">
                <div class="operation-page">
                    <div class="operation-header">
                        <div class="operation-heading">
                            <div class="operation-icon"><i class="fa-solid fa-credit-card"></i></div>
                            <div>
                                <h1 class="page-title">Payments</h1>
                                <p class="page-subtitle">Review all collected invoice payments.</p>
                            </div>
                        </div>
                    </div>
                    <section class="card operation-card">
                        <div class="table-wrapper operation-table">
                            <table class="table">
                                <thead>
                                    <tr>
                                        <th>Payment</th>
                                        <th>Invoice</th>
                                        <th>Guest</th>
                                        <th>Amount</th>
                                        <th>Method</th>
                                        <th>Date</th>
                                    </tr>
                                </thead>
                                <tbody id="paymentsTableBody">
                                    <tr>
                                        <td colspan="6" class="empty-state">Loading payments...</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </section>
                </div>
            </main>
        </div>
    </div>
    <script src="../../assets/js/api.js"></script>
    <script src="../../assets/js/auth.js"></script>
    <script src="../../assets/js/common.js"></script>
    <script src="../../assets/js/billing.js"></script>
</body>

</html>
