<div id="confirmModal" class="confirm-overlay d-none">

    <div class="confirm-box">

        <div class="confirm-header">

            <h3 id="confirmTitle">
                Confirmation
            </h3>

        </div>

        <div class="confirm-body">

            <p id="confirmMessage">
                Are you sure?
            </p>

        </div>

        <div class="confirm-footer">

            <button type="button" class="btn btn-secondary" onclick="ConfirmModal.close()">

                Cancel

            </button>

            <button type="button" class="btn btn-danger" id="confirmOkBtn">

                Confirm

            </button>

        </div>

    </div>

</div>
