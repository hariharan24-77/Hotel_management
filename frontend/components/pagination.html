<div class="pagination-wrapper">

    <div class="pagination-info">

        Showing
        <span id="pageStart">0</span>
        -
        <span id="pageEnd">0</span>
        of
        <span id="totalRecords">0</span>

    </div>

    <div class="pagination-controls">

        <button id="firstPageBtn" class="btn btn-secondary">

            First

        </button>

        <button id="prevPageBtn" class="btn btn-secondary">

            Previous

        </button>

        <span id="pageNumber">

            1

        </span>

        <button id="nextPageBtn" class="btn btn-secondary">

            Next

        </button>

        <button id="lastPageBtn" class="btn btn-secondary">

            Last

        </button>

        <select id="pageSize" class="form-select">

            <option value="5">5</option>
            <option value="10" selected>10</option>
            <option value="25">25</option>
            <option value="50">50</option>

        </select>

    </div>

</div>
